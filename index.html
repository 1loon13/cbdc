<title>Дослідження вибору платіжних засобів</title>
<style>
/* ES5/IE11-safe: без CSS-змінних, без flex gap, без inset, без :has/:focus-visible-залежностей */
*{box-sizing:border-box}
html{font-size:18px;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%}
body{margin:0;background:#fff;color:#111;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;font-size:18px;line-height:1.4}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:focus,input:focus,a:focus{outline:3px solid #2563eb;outline-offset:2px}
#app{display:block}
.page{max-width:1000px;margin:0 auto;padding:36px 28px 120px;min-height:100vh;position:relative}
h1{font-size:28px;line-height:1.25;margin:0 0 20px;font-weight:700}
h2{font-size:22px;line-height:1.3;margin:0 0 12px}
p{margin:0 0 14px}
.muted{color:#4a4a4a}
.small{font-size:14px}
.lead{font-size:19px}
.btn{display:inline-block;border:2px solid #1d3a5f;background:#1d3a5f;color:#fff;border-radius:6px;padding:12px 28px;font-size:18px;font-weight:600;min-height:48px;margin:0 12px 10px 0;-webkit-appearance:none}
.btn[disabled]{background:#9a9a9a;border-color:#9a9a9a;color:#fff;cursor:not-allowed}
.btn.secondary{background:#fff;color:#1d3a5f}
.btn-row{margin-top:26px}
.btn-row:after{content:"";display:table;clear:both}
.fin-row #wd{float:left;margin-top:12px;font-size:16px}
.fin-row #fin{float:right;margin:0}
.stop-wrap{max-width:1000px;margin:-80px auto 0;padding:0 28px 30px;position:relative;z-index:2}
.stop{background:none;border:none;color:#555;padding:8px 0;font-size:14px;text-decoration:underline}
.check{display:block;margin:12px 0;cursor:pointer;padding-left:34px;position:relative}
.check input{position:absolute;left:0;top:1px;width:22px;height:22px;margin:0}
.counter{font-size:15px;color:#555;margin-bottom:6px}
.q{margin:0 0 28px}
.q-title{font-weight:600;margin-bottom:10px}
.opt{display:block;border:1px solid #bdbdbd;border-radius:8px;padding:11px 14px 11px 46px;cursor:pointer;background:#fff;margin-bottom:8px;position:relative}
.opt input{position:absolute;left:14px;top:50%;margin:-10px 0 0 0;width:20px;height:20px}
.opt.sel{border-color:#1d3a5f;background:#eef3f8}
/* шкали: ширини у відсотках — вміщаються і на телефоні */
.scale{white-space:nowrap;font-size:0;max-width:560px}
.scale.s7{max-width:400px}
.scale .sc{display:inline-block;position:relative;font-size:18px;vertical-align:top}
.scale.s10 .sc{width:9.1%;margin-right:.9%}
.scale.s7 .sc{width:13%;margin-right:1.5%}
.scale input{position:absolute;left:0;top:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.scale label{display:block;text-align:center;height:44px;line-height:42px;border:1px solid #767676;border-radius:6px;background:#fff;cursor:pointer}
.scale input:checked+label{background:#1d3a5f;color:#fff;border-color:#1d3a5f}
.scale input:focus+label{outline:3px solid #2563eb;outline-offset:2px}
.anchors{max-width:560px;font-size:14px;color:#555;margin-top:5px;overflow:hidden}
.anchors.s7{max-width:400px}
.anchors .l{float:left}.anchors .r{float:right}
.row-item{margin-bottom:24px}
.row-item .lbl{font-weight:600;margin-bottom:8px}
.lk-head{font-size:14px;color:#555;margin-bottom:12px}
.lk-row{border-top:1px solid #e3e3e3;padding:14px 0}
.lk-row .stmt{margin-bottom:8px}
/* таблиця порівняння */
.cmp{width:100%;border-collapse:collapse;font-size:16px;margin-top:8px}
.cmp th,.cmp td{border:1px solid #c9c9c9;padding:10px 12px;vertical-align:top;text-align:left}
.cmp thead th{background:#eef1f5}
.cmp td.k{font-weight:600;background:#fafafa;width:18%}
.yn-row{border-top:1px solid #e3e3e3;padding:14px 0;overflow:hidden}
.yn-row .t{float:left;width:68%;padding-top:8px}
.yn-row .yn{float:right}
.yn label{display:inline-block;border:1px solid #767676;border-radius:6px;padding:8px 18px;margin-left:8px;cursor:pointer;position:relative}
.yn input{position:absolute;opacity:0;left:0;top:0;width:100%;height:100%;margin:0;cursor:pointer}
.yn label.on{background:#1d3a5f;color:#fff;border-color:#1d3a5f}
/* завдання вибору */
.task-title{font-size:23px;font-weight:700;margin:24px 0 22px;line-height:1.3}
.pair{display:-ms-flexbox;display:flex;-ms-flex-wrap:wrap;flex-wrap:wrap;border:1px solid #bdbdbd;border-radius:8px;overflow:hidden}
.opt-card{-ms-flex:1 1 50%;flex:1 1 50%;width:50%;padding:22px 18px;text-align:center;border-left:1px solid #bdbdbd;background:#fff}
.opt-card.first{border-left:none}
.opt-card .name{font-size:20px;font-weight:600;margin-bottom:18px;min-height:56px}
.opt-card.neutral .name{background:#f3f3f3;margin:-22px -18px 18px;padding:22px 12px;border-bottom:1px solid #bdbdbd}
.opt-card .name{min-height:3.2em}
.opt-card.neutral .name{min-height:4.6em}
.opt-card .btn{margin:0;min-width:150px}
/* нейтральна пара */
.pair-t{width:100%;table-layout:fixed;border-collapse:collapse;border:1px solid #bdbdbd}
.pair-t th,.pair-t td{width:50%;border:1px solid #bdbdbd;text-align:center;vertical-align:middle}
.pair-t th{background:#f3f3f3;font-size:20px;font-weight:600;padding:22px 12px}
.pair-t td{padding:18px 12px;background:#fff}
.pair-t .btn{margin:0;min-width:150px}
/* dominance */
.pair.dom .enh{-ms-flex:1 1 64%;flex:1 1 64%;width:64%;background:#eaf1f8}
.pair.dom .sup{-ms-flex:1 1 36%;flex:1 1 36%;width:36%}
.pair.dom .enh .name{font-size:22px;font-weight:700}
.pair.dom .sup .name{font-size:15px;font-weight:400;color:#333}
.pair.dom .o1{-ms-flex-order:1;order:1}.pair.dom .o2{-ms-flex-order:2;order:2}
.pair.dom .o1{border-left:none}
.pair.dom .o2{border-left:1px solid #bdbdbd}
.linkbtn{background:none;border:none;padding:6px 2px;color:#5f5f5f;font-size:14px;text-decoration:underline;cursor:pointer}
.timer{margin:6px 0 8px;color:#111}
.timer .digits{font-size:30px;font-weight:700;color:#b3122b;margin-right:12px;vertical-align:middle;font-variant-numeric:tabular-nums}
.timer .tlabel{vertical-align:middle;font-size:15px;display:inline-block}
.expired{border:2px solid #8a4b00;background:#fff8ec;border-radius:8px;padding:12px 16px;margin-bottom:8px;font-weight:600;color:#6b3a00}
/* ШІ */
.ai-intro{font-size:19px;color:#1d3a5f}
.ai-q{background:#eef1f5;border:1px solid #c9d2dc;padding:16px 18px;font-weight:600;color:#1d3a5f;margin:18px 0 22px}
.wait{text-align:center;padding-top:14vh}
.hourglass{display:block;width:64px;height:96px;margin:0 auto 18px}
.dots span{display:inline-block;width:10px;height:10px;border-radius:50%;background:#bdbdbd;margin:0 6px;-webkit-animation:pl 1s infinite;animation:pl 1s infinite}
.dots span.d2{-webkit-animation-delay:.15s;animation-delay:.15s}.dots span.d3{-webkit-animation-delay:.3s;animation-delay:.3s}
@-webkit-keyframes pl{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes pl{0%,100%{opacity:.25}50%{opacity:1}}
.ai-answer{border:1px solid #c9d2dc;border-left:4px solid #1d3a5f;padding:18px 20px;background:#fff;font-size:18px;color:#1d3a5f}
.ai-answer .who{font-size:14px;color:#555;margin-bottom:8px;font-weight:600}
.final-opt{display:block;width:100%;text-align:left;border:2px solid #1d3a5f;background:#fff;color:#1d3a5f;font-weight:700;padding:14px 16px;margin-bottom:14px;border-radius:4px;font-size:18px}
.final-opt:hover{background:#eef3f8}
.final-opt+.linkbtn{font-size:16px;color:#333;text-decoration:none;padding:6px 0}
.trans{text-align:center;padding-top:28vh}
/* оверлеї */
.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:50;overflow:auto;padding:20px}
.ov .box{background:#fff;border-radius:10px;padding:26px;max-width:560px;margin:12vh auto 0;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.ov.full{background:#fff}
.ov.full .box{box-shadow:none;text-align:center;max-width:640px}
.saving{position:fixed;right:16px;bottom:16px;font-size:14px;color:#555;z-index:6}
.err{color:#b00020;font-size:15px;margin-top:6px}
/* оператор */
.op{position:fixed;top:0;left:0;right:0;bottom:0;background:#f4f5f7;z-index:100;overflow:auto;font-size:15px;-webkit-overflow-scrolling:touch}
.op .wrap{max-width:980px;margin:0 auto;padding:20px}
.op h2{font-size:20px}
.op h3{font-size:16px;margin:0 0 10px}
.op .sec{background:#fff;border:1px solid #dcdcdc;border-radius:10px;padding:16px;margin-bottom:14px}
.op label.f{display:block;font-weight:600;margin:10px 0 4px}
.op input[type=text],.op input[type=password],.op select,.op textarea{width:100%;padding:8px 10px;border:1px solid #bbb;border-radius:6px;background:#fff;font-size:15px}
.op textarea{font-family:Consolas,monospace;font-size:12px;height:180px}
.op .btn{font-size:15px;padding:8px 14px;min-height:0;margin:8px 8px 0 0}
.op table.kv{border-collapse:collapse;width:100%}
.op table.kv td{padding:4px 8px 4px 0;vertical-align:top}
.op table.kv td.k{color:#555;width:42%}
.op .ok{color:#17702e;font-weight:600}.op .bad{color:#b00020;font-weight:600}
.op ol{padding-left:20px}.op li{margin-bottom:6px}
.op code{background:#eee;padding:1px 5px;border-radius:4px}
.op .half{display:inline-block;width:49%;vertical-align:top}
.op .half+.half{margin-left:1.5%}
@media (max-width:700px){
  html,body{font-size:17px}
  .page{padding:20px 16px 110px}
  h1{font-size:23px}
  .task-title{font-size:20px}
  .opt-card .name{font-size:17px}
  .pair-t th{font-size:17px;padding:16px 8px}
  .pair-t td{padding:14px 8px}
  .pair-t .btn{min-width:0;width:100%;padding:12px 6px}
  .pair.dom .enh .name{font-size:19px}
  .opt-card{padding:16px 10px}
  .opt-card .btn{min-width:0;width:100%;padding:12px 8px}
  .opt-card.neutral .name{margin:-16px -10px 14px;padding:16px 8px}
  .yn-row .t{float:none;width:auto;padding-top:0;margin-bottom:8px}
  .yn-row .yn{float:none}
  .yn label{margin:0 8px 0 0}
  .scale .sc label{height:40px;line-height:38px;font-size:16px}
  .cmp,.cmp thead,.cmp tbody,.cmp tr,.cmp th,.cmp td{display:block;width:auto}
  .cmp thead{display:none}
  .cmp tr{border:1px solid #c9c9c9;margin-bottom:12px}
  .cmp td{border:none;border-top:1px solid #e3e3e3}
  .cmp td.k{width:auto;border-top:none}
  .cmp td .hd{display:block;font-size:13px;color:#555;font-weight:600;margin-bottom:2px}
  .op .half{display:block;width:auto}.op .half+.half{margin-left:0}
  .stop-wrap{padding:0 16px 24px;margin-top:-70px}
}
@media (min-width:701px){ .cmp td .hd{display:none} }

var FLOW = ['s1', 's2', 's3', 's4a', 's4b', 's4c', 's5', 'sB1', 'sB2', 's6', 's7', 's8', 's9', 'assign', 's11q', 's11a', 's12', 's15'];

// ------------------------------------------------------------------ утиліти
function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function esc(s) { return s == null ? '' : String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function nowIso() { return new Date().toISOString(); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function on(el, ev, fn) { if (el) el.addEventListener(ev, fn, false); }
function randU32() { var c = window.crypto || window.msCrypto; if (c && c.getRandomValues) { var a = new Uint32Array(1); c.getRandomValues(a); return a[0]; } return Math.floor(Math.random() * 4294967296); }
function randUnit() { return randU32() / 4294967296; }
function shuffle(arr, rng) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rng() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function code(n) { var c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = ''; for (var i = 0; i < n; i++) s += c.charAt(randU32() % c.length); return s; }
function keys(arr) { return arr.map(function (x) { return x[0]; }); }
function contains(arr, v) { return arr.indexOf(v) >= 0; }
function qs(name) { var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search); return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : ''; }

// ------------------------------------------------------------------ сховище
var MEM = {};
var LS_OK = (function () { try { var ls = window.localStorage; if (!ls) return false; ls.setItem('__tp', '1'); ls.removeItem('__tp'); return true; } catch (e) { return false; } })();
function lsGet(k) { if (LS_OK) { try { var v = localStorage.getItem(k); return v == null ? null : JSON.parse(v); } catch (e) {} } return MEM.hasOwnProperty(k) ? clone(MEM[k]) : null; }
function lsSet(k, v) { MEM[k] = clone(v); if (!LS_OK) return true; try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function lsDel(k) { delete MEM[k]; if (LS_OK) { try { localStorage.removeItem(k); } catch (e) {} } }

// ------------------------------------------------------------------ налаштування
var GS = !!(window.google && google.script && google.script.run);
var EMBED = {}; try { EMBED = JSON.parse(($('#tp-config') || {}).textContent || '{}'); } catch (e) {}
var LOCALSET = lsGet('tp3.settings') || {};
var SETTINGS = Object.assign({ endpoint: '', mode: 'auto', station_id: '', operator_pin: '', cfg_version: 0 }, EMBED, LOCALSET);
if ((EMBED.cfg_version || 0) > (LOCALSET.cfg_version || 0)) Object.assign(SETTINGS, EMBED, { station_id: LOCALSET.station_id || '' });
['endpoint', 'mode', 'station_id'].forEach(function (k) { var v = qs(k); if (v) SETTINGS[k] = v; });
// лише для автоперевірок: ?urg=секунд&aiwait=мс
if (qs('urg')) URGENCY_SEC = parseFloat(qs('urg')); if (qs('aiwait')) AI_WAIT_MS = parseInt(qs('aiwait'), 10);
var ONLINE = GS || /^https?:/.test(location.protocol);
if (!SETTINGS.station_id) { SETTINGS.station_id = (ONLINE ? 'WEB-' : 'ST-') + code(4); saveSettings(); }
var ENTERED_PIN = '';
function opPin() { return ENTERED_PIN || SETTINGS.operator_pin; }
function saveSettings() { lsSet('tp3.settings', SETTINGS); }
function hasCloud() { return GS || !!SETTINGS.endpoint; }
function mode() { if (SETTINGS.mode === 'local' || SETTINGS.mode === 'local_sync') return SETTINGS.mode; return hasCloud() ? 'local_sync' : 'local'; }
function cloudOn() { return hasCloud() && mode() !== 'local'; }

// ------------------------------------------------------------------ мережа (XHR або google.script.run)
function post(body, timeoutMs, cb) {
  var done = false;
  function finish(err, res) { if (done) return; done = true; clearTimeout(t); cb(err, res); }
  var t = setTimeout(function () { finish(new Error('timeout')); }, timeoutMs || 15000);
  if (GS) {
    google.script.run.withSuccessHandler(function (r) { try { r = typeof r === 'string' ? JSON.parse(r) : r; } catch (e) { return finish(e); } if (r && r.ok) finish(null, r); else finish(new Error((r && r.error) || 'bad_response')); })
      .withFailureHandler(function (e) { finish(e || new Error('gs_failure')); }).api(JSON.stringify(body));
    return;
  }
  if (!SETTINGS.endpoint) return finish(new Error('no_endpoint'));
  try {
    var x = new XMLHttpRequest();
    x.open('POST', SETTINGS.endpoint, true);
    x.setRequestHeader('Content-Type', 'text/plain;charset=utf-8');
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status >= 200 && x.status < 300) { var r; try { r = JSON.parse(x.responseText); } catch (e) { return finish(new Error('bad_json')); } if (r && r.ok) finish(null, r); else finish(new Error((r && r.error) || 'bad_response')); }
      else finish(new Error('http_' + x.status));
    };
    x.send(JSON.stringify(body));
  } catch (e) { finish(e); }
}

// ------------------------------------------------------------------ сесії
function index() { return lsGet('tp3.index') || []; }
function getLocal(id) { return lsGet('tp3.s.' + id); }
function putLocal(s) { var ok = lsSet('tp3.s.' + s.session_id, s); var i = index(); if (!contains(i, s.session_id)) { i.push(s.session_id); lsSet('tp3.index', i); } return ok; }
function allLocal() { return index().map(getLocal).filter(function (x) { return !!x; }); }
function syncMap() { return lsGet('tp3.sync') || {}; }
function markSynced(id, rev) { var m = syncMap(); m[id] = Math.max(m[id] || 0, rev); lsSet('tp3.sync', m); lsSet('tp3.lastsync', nowIso()); }
function unsynced() { var m = syncMap(); return allLocal().filter(function (s) { return (m[s.session_id] || 0) < s.rev; }); }
function persist(s, cb) {
  s.rev = (s.rev || 0) + 1; s.updated_at = nowIso();
  var localOk = putLocal(s);
  if (cloudOn()) setTimeout(syncNow, 50);
  cb(localOk || !LS_OK);
}
var SYNCING = false, LAST_PING = null;
function syncNow(done) {
  if (SYNCING || !cloudOn()) { if (done) done(); return; }
  var list = unsynced(); if (!list.length) { if (done) done(); return; }
  SYNCING = true;
  (function step(i) {
    if (i >= list.length) { SYNCING = false; renderOpStatus(); if (done) done(); return; }
    var s = list[i];
    post({ action: 'save', session: s, flat: flat(s) }, 20000, function (err) {
      if (err) { LAST_PING = { ok: false, at: nowIso() }; SYNCING = false; renderOpStatus(); if (done) done(); return; }
      LAST_PING = { ok: true, at: nowIso() }; markSynced(s.session_id, s.rev); step(i + 1);
    });
  })(0);
}
function localAssign() {
  var b = lsGet('tp3.aiblock');
  if (!b || !b.slots || b.pos >= b.slots.length) { var n = (lsGet('tp3.aiblockcount') || 0) + 1; lsSet('tp3.aiblockcount', n); b = { id: SETTINGS.station_id + '-L' + n, slots: shuffle(AI_BLOCK, randUnit), pos: 0 }; }
  var a = { block_id: b.id, slot: b.pos + 1, ai_variant: b.slots[b.pos], source: 'local', assigned_at: nowIso() };
  b.pos++; lsSet('tp3.aiblock', b);
  return a;
}
function doAssign(s, cb) {
  if (s.assignment) return cb(s.assignment);
  if (!cloudOn()) return cb(localAssign());
  post({ action: 'assign', session_id: s.session_id, station_id: SETTINGS.station_id }, 8000, function (err, r) { cb(!err && r && r.assignment ? r.assignment : localAssign()); });
}

// ------------------------------------------------------------------ активний час (без часу у фоновій вкладці)
var CLOCKS = [];
function Clock() { this.acc = 0; this.since = null; this.running = false; }
Clock.prototype.start = function () { this.running = true; this.resume(); };
Clock.prototype.resume = function () { if (this.running && this.since === null && !document.hidden && !OP) this.since = nowMs(); };
Clock.prototype.pause = function () { if (this.since !== null) { this.acc += nowMs() - this.since; this.since = null; } };
Clock.prototype.stop = function () { this.pause(); this.running = false; return Math.round(this.acc); };
Clock.prototype.ms = function () { return Math.round(this.acc + (this.since !== null ? nowMs() - this.since : 0)); };
function newClock() { var c = new Clock(); CLOCKS.push(c); return c; }
function pauseAll() { CLOCKS.forEach(function (c) { c.pause(); }); }
function resumeAll() { CLOCKS.forEach(function (c) { c.resume(); }); }
on(document, 'visibilitychange', function () { if (document.hidden) pauseAll(); else resumeAll(); });

// ------------------------------------------------------------------ стан і рендер
var S = null, CUR = null, BUSY = false, OP = null, PREVIEW = false;
var app = document.getElementById('app');
function logFlow(screen, event, detail) {
  if (!S || PREVIEW) return;
  S.flow.push({ seq: S.flow.length + 1, screen: screen, event: event, at: nowIso(), active_ms: CUR && CUR.clock ? CUR.clock.ms() : null, detail: detail || '' });
}
function cleanup() { if (CUR && CUR.cleanup) CUR.cleanup(); if (CUR && CUR.clock) CUR.clock.stop(); CLOCKS = []; CUR = null; }
function render(html, key, opts) {
  opts = opts || {};
  cleanup();
  app.innerHTML = '<div class="page">' + html + '</div>' + '';
  try { window.scrollTo(0, 0); } catch (e) {}
  CUR = { key: key, clock: newClock(), cleanup: null };
  on($('#stop-btn'), 'click', function () { askStop(); });
  var c = CUR.clock; raf(function () { raf(function () { c.start(); }); });
  if (S && key) logFlow(key, 'show', opts.detail);
  return CUR;
}
function overlay(html, cls) {
  var d = document.createElement('div'); d.className = 'ov ' + (cls || '');
  d.innerHTML = '<div class="box" role="dialog" aria-modal="true">' + html + '</div>';
  document.body.appendChild(d);
  var f = d.querySelector('button, input'); if (f) try { f.focus(); } catch (e) {}
  return d;
}
function showMissing() { if (document.querySelector('.ov.c2')) return; var o = overlay('<p>' + MSG.missing + '</p><div class="btn-row"><button class="btn" type="button">Повернутися</button></div>', 'c2'); on(o.querySelector('button'), 'click', function () { removeEl(o); }); if (CUR) logFlow(CUR.key, 'missing'); }

function complete(key, mutate) {
  if (BUSY || !S || contains(S.saved, key)) return;
  BUSY = true;
  var active = CUR && CUR.clock ? CUR.clock.stop() : null;
  if (mutate) mutate(active);
  S.saved.push(key);
  logFlow(key, 'save');
  persist(S, function (ok) { BUSY = false; if (!ok) return showTech(key); next(); });
}
function nextKey() { for (var i = 0; i < FLOW.length; i++) { var k = FLOW[i]; if (k === 'assign') { if (!S.assignment) return k; } else if (!contains(S.saved, k)) return k; } return null; }
function next() {
  if (!S) return SCREENS.s1();
  var k = nextKey();
  if (!k) return showDone();
  if (k === 'assign') return runAssign();
  SCREENS[k]();
}
function wasShown(screen) { for (var i = 0; i < S.flow.length; i++) if (S.flow[i].screen === screen && S.flow[i].event === 'show') return true; return false; }

function newSession() {

    created_at: nowIso(), updated_at: null, completed_at: null, status: 'in_progress', use_prohibited: 0,
    assignment: null, saved: [], answers: {}, tasks: [], flow: [], rev: 0, resumed: 0,

}

function radios(name, opts) { return opts.map(function (o) { return '<label class="opt"><input type="radio" name="' + name + '" value="' + esc(o[0]) + '"> ' + esc(o[1]) + '</label>'; }).join(''); }
function scale(name, n) {
  var h = '<div class="scale s' + n + '" role="radiogroup">';
  for (var i = 1; i <= n; i++) h += '<span class="sc"><input type="radio" id="' + name + '_' + i + '" name="' + name + '" value="' + i + '" aria-label="' + i + '"><label for="' + name + '_' + i + '">' + i + '</label></span>';
  return h + '</div>';
}
function anchors(n, l, r) { return '<div class="anchors s' + n + '"><span class="l">' + l + '</span><span class="r">' + r + '</span></div>'; }
function val(name) { var el = document.querySelector('input[name="' + name + '"]:checked'); if (!el) return null; return /^\d+$/.test(el.value) ? parseInt(el.value, 10) : el.value; }
function wireOpts() { $$('.opt input').forEach(function (inp) { on(inp, 'change', function () { $$('input[name="' + inp.name + '"]').forEach(function (x) { x.parentNode.className = x.checked ? 'opt sel' : 'opt'; }); }); }); }

function rowsOf(items, n, anch) { return items.map(function (it) { return '<div class="row-item"><div class="lbl">' + esc(it[1]) + '</div>' + scale(it[0], n) + (anch ? anchors(n, anch[0], anch[1]) : '') + '</div>'; }).join(''); }

  on($('#op-file'), 'change', function (e) {

    rd.onload = function () { try { var j = JSON.parse(rd.result), n = 0; (j.sessions || []).forEach(function (s) { if (!s.session_id) return; var ex = getLocal(s.session_id); if (!ex || (ex.rev || 0) < (s.rev || 0)) { putLocal(s); n++; } }); $('#op-msg').textContent = 'Імпортовано/оновлено сесій: ' + n; renderOpStatus(); if (cloudOn()) syncNow(); } catch (err) { $('#op-msg').textContent = 'Помилка JSON: ' + err.message; } };
    rd.readAsText(f, 'utf-8');
  });
  on($('#op-save'), 'click', function () { readOp(); saveSettings(); $('#op-msg').innerHTML = '<span class="ok">Збережено.</span>'; renderOpStatus(); });
  on($('#op-dl'), 'click', function () {
    readOp(); SETTINGS.cfg_version = new Date().getTime(); saveSettings();
    var cfg = { endpoint: SETTINGS.endpoint, mode: SETTINGS.mode, station_id: '', operator_pin: SETTINGS.operator_pin, cfg_version: SETTINGS.cfg_version };
    var html = INITIAL_HTML.replace(/(<script id="tp-config" type="application\/json">)[\s\S]*?(<\/script>)/, function (m0, a, b) { return a + JSON.stringify(cfg).replace(/</g, '\\u003c') + b; });
    download('index.html', html, 'text/html;charset=utf-8');
  });
  on($('#pv-go'), 'click', function () { var p = $('#pv').value.split('|'); closeOp(); preview(p[0], p[1]); });
}
function fillOp() { $('#op-st').textContent = SETTINGS.station_id; $('#op-station').value = SETTINGS.station_id; $('#op-mode').value = SETTINGS.mode === 'local' || SETTINGS.mode === 'local_sync' ? SETTINGS.mode : 'auto'; $('#op-endpoint').value = SETTINGS.endpoint || ''; $('#op-pin').value = SETTINGS.operator_pin || ''; }
function readOp() { SETTINGS.station_id = $('#op-station').value.replace(/^\s+|\s+$/g, '') || SETTINGS.station_id; SETTINGS.mode = $('#op-mode').value; SETTINGS.endpoint = $('#op-endpoint').value.replace(/^\s+|\s+$/g, ''); SETTINGS.operator_pin = $('#op-pin').value.replace(/^\s+|\s+$/g, ''); }
function renderOpStatus() {
  if (!OP) return;
  var all = allLocal(), un = unsynced();
  $('#op-status').innerHTML = kv([
    ['Режим', mode() === 'local' ? 'Лише локально' : 'Локально + автосинхронізація з Таблицею'],
    ['Таблиця', hasCloud() ? (LAST_PING ? (LAST_PING.ok ? '<span class="ok">на зв\'язку</span>' : '<span class="bad">немає зв\'язку</span>') : 'не перевірялась') : '<span class="bad">не налаштована</span>'],
    ['Сховище браузера', LS_OK ? '<span class="ok">доступне</span>' : '<span class="bad">недоступне — дані лише в пам\'яті до закриття сторінки</span>'],
    ['Сесій на пристрої', all.length + ' (завершено: ' + all.filter(function (s) { return s.status === 'completed'; }).length + ')'],
    ['Не вивантажено в Таблицю', hasCloud() ? (un.length ? '<span class="bad">' + un.length + '</span>' : '<span class="ok">0</span>') : '—'],
    ['Відмов на першому екрані', lsGet('tp3.declined') || 0]]);
  $('#op-cur').innerHTML = S ? kv([['Код сесії', esc(S.session_id)], ['Екран', CUR ? esc(CUR.key || '—') : '—'], ['Збережено екранів', S.saved.length], ['Відповідь ШІ', S.assignment ? S.assignment.ai_variant + ' (' + S.assignment.source + ')' : 'ще не призначено']]) : kv([['Активна сесія', 'немає']]);
}
function closeOp() { removeEl(OP); OP = null; resumeAll(); }
function preview(screen, v) {
  PREVIEW = true; S = newSession();
  if (screen === 's11a') { render('<div class="ai-answer"><div class="who">Відповідь ШІ (перегляд, варіант ' + v + ')</div>' + esc(AI_TEXT[v]) + '</div><div class="btn-row"><button class="btn pick" id="go" type="button">Далі</button></div>', null); on($('#go'), 'click', function () { PREVIEW = false; S = null; SCREENS.s1(); }); return; }
  renderTask(screen); removeEl($('#stop-btn'));
}
on(document, 'keydown', function (e) { if (e.ctrlKey && e.shiftKey && (e.keyCode === 79)) { if (e.preventDefault) e.preventDefault(); askPin(openOp); } });
var corner = { n: 0, t: 0 };
on(document, 'click', function (e) { if (e.detail > 0 && (e.clientX > 0 || e.clientY > 0) && e.clientX < 70 && e.clientY < 70) { var n = new Date().getTime(); corner.n = n - corner.t < 900 ? corner.n + 1 : 1; corner.t = n; if (corner.n >= 5) { corner.n = 0; askPin(openOp); } } });

// «Повернутися до завершеної сторінки не можна» (макет, екран 2): кнопка «Назад» не повертає
try { if (history.pushState) { history.pushState({ tp: 1 }, '', location.href); window.addEventListener('popstate', function () { try { history.pushState({ tp: 1 }, '', location.href); } catch (e) {} }); } } catch (e) {}
window.onbeforeunload = function (e) { if (S && S.status === 'in_progress' && !PREVIEW) { var m = 'Сесія триває.'; (e || window.event).returnValue = m; return m; } };
setInterval(function () { if (cloudOn()) syncNow(); }, 20000);

(function init() {
  // якщо сторінку перезавантажили посеред проходження — тихо продовжуємо з першого незбереженого екрана
  var act = lsGet('tp3.active'), prev = act ? getLocal(act) : null;
  if (prev && prev.status === 'in_progress' && prev.saved && prev.saved.length) { S = prev; S.resumed = (S.resumed || 0) + 1; logFlow('resume', 'resume'); next(); }
  else { setActive(null); SCREENS.s1(); }
  if (cloudOn()) syncNow();
  window.TP = { version: APP_VERSION, flat: flat, state: function () { return S; }, screen: function () { return CUR ? CUR.key : null; }, busy: function () { return BUSY; }, settings: SETTINGS, flow: FLOW };
})();
})();

</script>
</body>
